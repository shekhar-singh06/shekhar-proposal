<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proposal ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff5f9e,#ff8fb1);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.container{

width:90%;
max-width:380px;
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);

}

h1{

color:#ff2d75;
margin-bottom:15px;

}

input{

width:100%;
padding:14px;
border:2px solid #ff2d75;
border-radius:10px;
font-size:18px;
outline:none;
margin-bottom:15px;

}

button{

padding:14px 22px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
margin:5px;

}

.generate{

background:#ff2d75;
color:white;

}

.copy{

background:#009688;
color:white;

}

.share{

background:#25D366;
color:white;

}

#link{

margin-top:15px;
word-break:break-word;
font-size:14px;
color:#333;

}

#proposal{

display:none;
margin-top:25px;

}

#proposal h2{

color:#ff2d75;
margin-bottom:25px;

}

.buttons{

position:relative;
height:180px;

}

#yes{

background:#2ecc71;
color:white;
position:absolute;
left:20%;
bottom:20px;

}

#no{

background:#e74c3c;
color:white;
position:absolute;
right:20%;
top:20px;

}

.popup{

display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;

}

.popup-box{

background:white;
padding:25px;
border-radius:20px;
text-align:center;
width:85%;
max-width:320px;

}

.popup-box h2{

color:#ff2d75;

}

.popup-box p{

margin:15px 0;

}

.popup-box button{

background:#ff2d75;
color:white;

}

</style>

</head>

<body>

<div class="container">

<h1>❤️ Proposal Link Generator ❤️</h1>

<input
type="text"
id="name"
placeholder="Enter Crush Name">

<button class="generate"
onclick="generateLink()">

Generate Link

</button>

<button class="copy"
onclick="copyLink()">

Copy

</button>

<button class="share"
onclick="shareLink()">

WhatsApp

</button>

<div id="link"></div>

<div id="proposal">

<h2 id="title"></h2>

<div class="buttons">

<button id="yes">
Yes ❤️
</button>

<button id="no">
No 😅
</button>

</div>

</div>

</div>

<div class="popup" id="popup">

<div class="popup-box">

<h2>❤️ Yay ❤️</h2>

<p id="message"></p>

<button onclick="closePopup()">
Close
</button>

</div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
const personName = params.get("name");

if(personName){
    document.getElementById("proposal").style.display="block";
    document.getElementById("title").innerHTML =
        `${decodeURIComponent(personName)}, Will You Be Mine? ❤️`;

    document.getElementById("message").innerHTML =
        `I Love You ${decodeURIComponent(personName)} ❤️`;
}

// ===== Generate Link =====
function generateLink(){

    let name = document.getElementById("name").value.trim();

    if(name==""){
        alert("Please enter a name.");
        return;
    }

    const url =
        window.location.origin +
        window.location.pathname +
        "?name=" +
        encodeURIComponent(name);

    document.getElementById("link").innerHTML =
        `<a href="${url}" target="_blank">${url}</a>`;
}

// ===== Copy Link =====
function copyLink(){

    let text =
        document.getElementById("link").innerText;

    if(text==""){
        alert("Generate link first.");
        return;
    }

    navigator.clipboard.writeText(text);

    alert("Link Copied ✅");
}

// ===== WhatsApp Share =====
function shareLink(){

    let text =
        document.getElementById("link").innerText;

    if(text==""){
        alert("Generate link first.");
        return;
    }

    window.open(
        "https://wa.me/?text="+
        encodeURIComponent(text),
        "_blank"
    );
}

// ===== No Button Runs Away =====
const noBtn=document.getElementById("no");

function moveButton(){

    const x=Math.random()*(window.innerWidth-120);
    const y=Math.random()*(window.innerHeight-70);

    noBtn.style.position="fixed";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
}

noBtn.addEventListener("mouseover",moveButton);

noBtn.addEventListener("touchstart",function(e){
    e.preventDefault();
    moveButton();
});

// ===== Yes Button =====
document.getElementById("yes").onclick=function(){
    document.getElementById("popup").style.display="flex";
}

// ===== Close Popup =====
function closePopup(){
    document.getElementById("popup").style.display="none";
}
</script>
</body>
</html>
